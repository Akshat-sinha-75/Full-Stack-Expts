<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Drawing Tool</title>

<style>
    body {
        margin: 0;
        background: #0d1117;
        font-family: Arial, sans-serif;
        color: white;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        padding: 10px;
        display: flex;
        justify-content: center;
        gap: 20px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
    }

    input[type="color"], button {
        padding: 8px 15px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        background: #21262d;
        color: white;
        font-size: 1rem;
        border: 1px solid #30363d;
    }

    button:hover {
        background: #30363d;
    }

    svg {
        flex: 1;
        width: 100vw;
        height: 100%;
        background: #0d1117;
        touch-action: none;
    }
</style>
</head>

<body>

<header>
    <input type="color" id="colorPicker" value="#00ffcc">
    <button id="undoBtn">Undo</button>
</header>

<svg id="svgCanvas"></svg>

<script>
    const svg = document.getElementById('svgCanvas');
    const colorPicker = document.getElementById('colorPicker');
    const undoBtn = document.getElementById('undoBtn');

    let isDrawing = false;
    let currentPath = null;
    let paths = []; 


    svg.addEventListener("mousedown", (e) => {
        isDrawing = true;

        const { x, y } = getMousePos(e);

        currentPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        currentPath.setAttribute("stroke", colorPicker.value);
        currentPath.setAttribute("stroke-width", "3");
        currentPath.setAttribute("fill", "none");
        currentPath.setAttribute("d", `M ${x},${y}`);

        svg.appendChild(currentPath);
        paths.push(currentPath);
    });


    svg.addEventListener("mousemove", (e) => {
        if (!isDrawing) return;

        const { x, y } = getMousePos(e);

        let d = currentPath.getAttribute("d");
        currentPath.setAttribute("d", `${d} L ${x},${y}`);
    });

  
    svg.addEventListener("mouseup", () => {
        isDrawing = false;
    });

    svg.addEventListener("mouseleave", () => isDrawing = false);


    undoBtn.addEventListener("click", () => {
        if (paths.length === 0) return;

        const last = paths.pop();
        svg.removeChild(last);
    });


    function getMousePos(evt) {
        const rect = svg.getBoundingClientRect();
        return {
            x: evt.clientX - rect.left,
            y: evt.clientY - rect.top
        };
    }
</script>

</body>
</html>
